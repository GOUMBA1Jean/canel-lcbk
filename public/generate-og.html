<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; }
  .card {
    width: 1200px; height: 630px;
    background: #1E5A8E;
    display: flex; flex-direction: column;
    justify-content: center; padding: 80px;
    font-family: Georgia, serif; color: white;
    box-sizing: border-box;
  }
  .sub { font-size: 22px; color: #A8CBE8; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 30px; font-family: monospace; }
  .title { font-size: 72px; line-height: 1.1; margin-bottom: 20px; }
  .title span { color: #B5966E; font-style: italic; }
  .desc { font-size: 24px; color: #D0E4F2; max-width: 800px; font-family: Arial, sans-serif; line-height: 1.5; }
  .bar { width: 80px; height: 4px; background: #B5966E; margin-bottom: 30px; }
</style>
</head>
<body>
<div class="card">
  <div class="sub">CANEL-LCBK · Kyabé · Tchad · Depuis 2009</div>
  <div class="bar"></div>
  <div class="title">Une chaîne qui <span>continue</span>.</div>
  <div class="desc">Plateforme officielle des anciens et nouveaux élèves du Lycée Collège la Bénédiction de Kyabé.</div>
</div>
</body>
</html>
